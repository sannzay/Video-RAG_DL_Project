[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Exclude integration tests from the default run — they need either VCR
# cassettes or live API keys. Opt in explicitly with: pytest -m integration
addopts = -ra --strict-markers -m "not integration"
markers =
    integration: end-to-end tests requiring VCR cassettes or live API keys (opt-in via `-m integration`)
