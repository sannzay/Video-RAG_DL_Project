# Railway deployment configuration for QuadRAG Backend

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && python3.11 -m pip install -e ."

[deploy]
startCommand = "cd backend && python3.11 api.py"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
