# Railway deployment configuration for QuadRAG Backend
# Nixpacks will use nixpacks.toml for build configuration

[build]
builder = "NIXPACKS"
# buildCommand removed - using nixpacks.toml instead

[deploy]
# startCommand removed - using nixpacks.toml instead
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
