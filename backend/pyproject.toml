[project]
name = "quadrag"
version = "0.1.0"
description = "A Four-Index Multimodal RAG System for Video Understanding"
requires-python = ">=3.10"
dependencies = [
    "pixeltable>=0.4.1",
    "groq>=0.11.0",
    "openai>=1.91.0",
    "google-generativeai>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.12",
    "loguru>=0.7.3",
    "moviepy>=2.2.1",
    "pillow>=11.0.0",
    "sentence-transformers>=4.1.0",
    "transformers>=4.52.4",
    "torch>=2.1.0",
    "numpy>=1.24.0,<2.0.0",
    "aiofiles>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadrag"]

