# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "ffmpeg", "postgresql"]

[phases.install]
cmds = [
    "cd backend && python3.11 -m venv /app/venv",
    "source /app/venv/bin/activate && cd backend && pip install --upgrade pip setuptools wheel",
    "source /app/venv/bin/activate && cd backend && pip install -e ."
]

[start]
cmd = "source /app/venv/bin/activate && cd backend && python api.py"
