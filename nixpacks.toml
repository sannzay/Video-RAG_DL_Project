# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "postgresql"]

[phases.install]
cmds = ["cd backend && python3.11 -m pip install --upgrade pip", "cd backend && python3.11 -m pip install -e ."]

[start]
cmd = "cd backend && python3.11 api.py"
