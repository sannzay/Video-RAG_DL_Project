# Nixpacks configuration for Railway deployment

[phases.setup]
# Core packages
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "ffmpeg", "postgresql", "zlib"]
# Install g++ which brings in a working libstdc++
aptPkgs = ["g++", "libgomp1"]

[phases.install]
cmds = [
    # Comprehensive search for libstdc++ - check all possible locations
    "echo '=== Searching for libstdc++ ===' && find / -name 'libstdc++.so*' 2>/dev/null | head -20",
    # Check what the linker would find
    "echo '=== ldconfig search ===' && ldconfig -p | grep libstdc++ || echo 'ldconfig found nothing'",
    "cd backend && python3.11 -m venv /app/venv",
    "source /app/venv/bin/activate && pip install --upgrade pip setuptools wheel",
    # Install numpy FIRST with a stable version to avoid conflicts
    "source /app/venv/bin/activate && pip install 'numpy>=1.24.0,<2.0.0'",
    # Install CPU-only PyTorch - use extra-index-url to prefer CPU version
    "source /app/venv/bin/activate && pip install 'torch>=2.0.0,<2.1.0' --extra-index-url https://download.pytorch.org/whl/cpu",
    # Install all other dependencies from requirements.txt
    "source /app/venv/bin/activate && cd backend && pip install -r requirements.txt",
    # Install the package itself without dependencies (already installed above)
    "source /app/venv/bin/activate && cd backend && pip install -e . --no-deps",
    # Force reinstall numpy to ensure it's properly installed (fixes source directory issue)
    "source /app/venv/bin/activate && pip install --force-reinstall --no-deps 'numpy>=1.24.0,<2.0.0'",
    # Find libstdc++ and save path (include nix paths too)
    "LIBSTDCPP=$(find / -name 'libstdc++.so.6' -type f 2>/dev/null | head -1) && if [ -n \"$LIBSTDCPP\" ]; then LIBDIR=$(dirname \"$LIBSTDCPP\") && echo \"Found libstdc++ at: $LIBDIR\" && echo \"$LIBDIR\" > /app/libstdcpp_dir.txt; else echo 'No libstdc++.so.6 found!' && echo '' > /app/libstdcpp_dir.txt; fi",
    # Check standard lib locations
    "ls -la /usr/lib/x86_64-linux-gnu/libstdc++* 2>/dev/null || echo 'Nothing in /usr/lib/x86_64-linux-gnu/'",
    "ls -la /lib/x86_64-linux-gnu/libstdc++* 2>/dev/null || echo 'Nothing in /lib/x86_64-linux-gnu/'",
    # Find torch installation directory (before trying to import torch)
    "source /app/venv/bin/activate && TORCH_DIR=$(python -c 'import importlib.util; spec = importlib.util.find_spec(\"torch\"); print(spec.submodule_search_locations[0] if spec else \"\")') && echo \"Torch dir: $TORCH_DIR\" && echo \"$TORCH_DIR\" > /app/torch_dir.txt && ls -la $TORCH_DIR/lib/ 2>/dev/null || echo 'No torch/lib directory'",
    # Test torch import with detailed error - try multiple approaches
    "source /app/venv/bin/activate && LIBDIR=$(cat /app/libstdcpp_dir.txt 2>/dev/null) && TORCH_LIB=$(cat /app/torch_dir.txt)/lib && export LD_LIBRARY_PATH=$LIBDIR:$TORCH_LIB:$LD_LIBRARY_PATH && echo \"Testing torch with LD_LIBRARY_PATH=$LD_LIBRARY_PATH\" && python -c 'import torch; print(f\"Torch {torch.__version__} OK\")' 2>&1 || echo 'Torch import failed'"
]

[start]
# Set LD_LIBRARY_PATH with saved libstdc++ path and torch lib (paths saved during build)
cmd = "LIBDIR=$(cat /app/libstdcpp_dir.txt 2>/dev/null) && TORCH_LIB=$(cat /app/torch_dir.txt 2>/dev/null)/lib && export LD_LIBRARY_PATH=$LIBDIR:$TORCH_LIB:$LD_LIBRARY_PATH && echo \"LD_LIBRARY_PATH=$LD_LIBRARY_PATH\" && source /app/venv/bin/activate && cd backend && python api.py"
