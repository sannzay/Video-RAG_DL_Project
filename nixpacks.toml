# Nixpacks configuration for Railway deployment

[phases.setup]
# Use stdenv.cc.cc.lib for C++ runtime (compatible with nix Python)
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "ffmpeg", "postgresql", "zlib", "stdenv.cc.cc.lib"]
# No apt packages needed - using nix for everything

[phases.install]
cmds = [
    # Update ldconfig cache and verify libstdc++ installation
    "sudo ldconfig && echo '=== ldconfig updated ==='",
    # Comprehensive search for libstdc++ - check all possible locations
    "echo '=== Searching for libstdc++ ===' && find /usr /lib -name 'libstdc++.so*' 2>/dev/null | head -20",
    # Check what the linker would find
    "echo '=== ldconfig search ===' && ldconfig -p | grep libstdc++ || echo 'ldconfig found nothing'",
    "cd backend && python3.11 -m venv /app/venv",
    "source /app/venv/bin/activate && pip install --upgrade pip setuptools wheel",
    # Install numpy FIRST with a stable version to avoid conflicts
    "source /app/venv/bin/activate && pip install 'numpy>=1.24.0,<2.0.0'",
    # Install CPU-only PyTorch - need >= 2.1 for CLIP models
    "source /app/venv/bin/activate && pip install 'torch>=2.1.0,<2.2.0' --extra-index-url https://download.pytorch.org/whl/cpu",
    # Install all other dependencies from requirements.txt
    "source /app/venv/bin/activate && cd backend && pip install -r requirements.txt",
    # Install the package itself without dependencies (already installed above)
    "source /app/venv/bin/activate && cd backend && pip install -e . --no-deps",
    # Force reinstall numpy to ensure it's properly installed (fixes source directory issue)
    "source /app/venv/bin/activate && pip install --force-reinstall --no-deps 'numpy>=1.24.0,<2.0.0'",
    # Find libstdc++ from nix (stdenv.cc.cc.lib) - compatible with nix Python
    "echo '=== Finding libstdc++ ===' && LIBSTDCPP='' && if [ -f '/nix/var/nix/profiles/default/lib/libstdc++.so.6' ]; then LIBSTDCPP='/nix/var/nix/profiles/default/lib/libstdc++.so.6'; else LIBSTDCPP=$(find /nix/store -name 'libstdc++.so.6' -path '*/lib/*' 2>/dev/null | head -1); fi && if [ -n \"$LIBSTDCPP\" ] && [ -f \"$LIBSTDCPP\" ]; then LIBDIR=$(dirname \"$LIBSTDCPP\") && echo \"Found libstdc++ at: $LIBDIR (from $LIBSTDCPP)\" && echo \"$LIBDIR\" > /app/libstdcpp_dir.txt; else echo 'ERROR: No nix libstdc++.so.6 found!' && exit 1; fi",
    # Test ffmpeg availability and functionality
    "echo '=== Testing ffmpeg ===' && ffmpeg -version | head -3 && echo 'FFmpeg OK' || echo 'FFmpeg failed'",
    # Test basic video processing
    "echo '=== Testing video processing ===' && python -c 'import subprocess; result = subprocess.run([\"ffmpeg\", \"-i\", \"/dev/null\"], capture_output=True, text=True); print(f\"FFmpeg exit code: {result.returncode}\")' 2>/dev/null || echo 'FFmpeg test completed'",
    # Test pixeltable import (may fail but should give us info)
    "source /app/venv/bin/activate && echo '=== Testing pixeltable import ===' && python -c 'import pixeltable as pxt; print(f\"Pixeltable {pxt.__version__} OK\")' 2>&1 && echo 'Pixeltable import OK' || echo 'Pixeltable import failed - this is expected in build'",
    # Test if ffmpeg can analyze a basic video file
    "source /app/venv/bin/activate && echo '=== Testing ffmpeg video analysis ===' && python -c 'import subprocess, json; result = subprocess.run([\"ffmpeg\", \"-i\", \"test.mp4\"], capture_output=True, text=True, timeout=10) if False else print(\"Would test video analysis here\")' 2>/dev/null || echo 'FFmpeg analysis test skipped'",
    # Verify the saved path actually has the file
    "LIBDIR=$(cat /app/libstdcpp_dir.txt) && if [ -f \"$LIBDIR/libstdc++.so.6\" ]; then echo \"Verified: $LIBDIR/libstdc++.so.6 exists and is executable: $(ls -la \"$LIBDIR/libstdc++.so.6\")\"; else echo \"FATAL: $LIBDIR/libstdc++.so.6 does NOT exist\" && exit 1; fi",
    # Find torch installation directory (before trying to import torch)
    "source /app/venv/bin/activate && TORCH_DIR=$(python -c 'import importlib.util; spec = importlib.util.find_spec(\"torch\"); print(spec.submodule_search_locations[0] if spec else \"\")') && echo \"Torch dir: $TORCH_DIR\" && echo \"$TORCH_DIR\" > /app/torch_dir.txt && ls -la $TORCH_DIR/lib/ 2>/dev/null || echo 'No torch/lib directory'",
    # Test torch import with the correct LD_LIBRARY_PATH (same as runtime)
    "source /app/venv/bin/activate && LIBDIR=$(cat /app/libstdcpp_dir.txt 2>/dev/null) && TORCH_LIB=$(cat /app/torch_dir.txt 2>/dev/null)/lib && export LD_LIBRARY_PATH=$LIBDIR:$TORCH_LIB:/nix/var/nix/profiles/default/lib:$LD_LIBRARY_PATH && echo \"Final test with LD_LIBRARY_PATH=$LD_LIBRARY_PATH\" && python -c 'import torch; print(f\"Torch {torch.__version__} OK - build test passed\")' 2>&1 && echo 'BUILD SUCCESS: Torch import works!' || (echo 'BUILD FAILED: Torch import failed' && exit 1)"
]

[start]
# Simple startup command to test if container starts at all
cmd = "echo 'Container started successfully'; echo \"PORT=${PORT:-8080}\"; echo \"PWD=$(pwd)\"; ls -la /app/ | head -10; echo 'Test completed'"
